name: TradingApp Pipeline

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Frontend
      - name: Install Frontend
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # Backend
      - name: Install Backend
        working-directory: backend
        run: npm install

      # Optional backend lint if available
      - name: Backend Lint
        working-directory: backend
        run: npm run lint --if-present